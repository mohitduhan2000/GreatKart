
{% extends 'base.html' %}
{% load static %}

{% block title %}
GreatKart | Home
{% endblock %}

{% block content %}

<!-- Main Banner -->
<section class="section-intro padding-y-sm">

    <div class="container">

        <div class="intro-banner-wrap">
            <img src="{% static 'images/banners/1.jpg' %}"
                class="img-fluid rounded"
                alt="GreatKart Banner">
        </div>

    </div>

</section>


<!-- Popular Products -->
<section class="section-name padding-y-sm">

    <div class="container">

        <header class="section-heading">
            <a href="#" class="btn btn-outline-primary float-right">See all</a>
            <h3 class="section-title">Popular products</h3>
        </header>

        <div class="row">

            {% for number in "12345679" %}

            <div class="col-md-3">

                <div class="card card-product-grid">

                    <a href="#" class="img-wrap">
                        <img src="{% static 'images/items/' %}{{ number }}.jpg"
                            alt="Product {{ number }}">
                    </a>

                    <figcaption class="info-wrap">
                        <a href="#" class="title">GreatKart Product {{ number }}</a>
                        <div class="price mt-1">$179.00</div>
                    </figcaption>

                </div>

            </div>

            {% endfor %}

        </div>

    </div>

</section>

{% endblock %}
